<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Our Little Screen</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
  :root{--bg:#050308;--ink:#f6e7cf;--gold:#ffcf6b;--orange:#ff8a3d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px}
  #stage{position:relative;width:100%;flex:1;min-height:0;border-radius:34px;overflow:hidden;box-shadow:0 0 80px #ff8a3d22, 0 0 0 1px #ffffff10;background:#000}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #stage canvas:active{cursor:grabbing}
  .grain{position:absolute;inset:-50%;pointer-events:none;opacity:.14;mix-blend-mode:overlay;animation:g .5s steps(4) infinite;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,#0000 55%,#000a 100%)}
  @keyframes g{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
  .pill{border:0;border-radius:999px;padding:9px 16px;background:#ffffff14;color:var(--ink);font:inherit;cursor:pointer;backdrop-filter:blur(8px);white-space:nowrap;transition:background .2s, box-shadow .2s}
  .pill:hover{background:#ffffff22}
  .pill.on{background:linear-gradient(90deg,#ff8a3dcc,#ffcf6bcc);color:#1a0d06;box-shadow:0 0 24px #ff8a3d66}
  #top{position:absolute;left:14px;right:14px;top:12px;display:flex;gap:8px;align-items:center;z-index:3;pointer-events:none}
  #top>*{pointer-events:auto}
  #status{font-size:13px;opacity:.9;padding:7px 14px;border-radius:999px;background:#00000066;backdrop-filter:blur(8px)}
  #actions{position:absolute;right:14px;bottom:12px;display:flex;gap:8px;z-index:3;flex-wrap:wrap;justify-content:flex-end}
  #places{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:2px 4px 2px;scrollbar-width:none;flex:none}
  #places::-webkit-scrollbar{display:none}
  #hint{font-size:12px;opacity:.5;text-align:center;flex:none}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:radial-gradient(ellipse at 50% 30%,#3a1d2aee,#050308f5 70%)}
  #card{width:min(92vw,380px);padding:26px 22px;border-radius:36px;background:#140c18cc;box-shadow:0 0 70px #ff8a3d33;text-align:center}
  #card h1{margin:0 0 4px;font-size:24px;color:var(--gold);text-shadow:0 0 18px #ff8a3d88}
  #card p{margin:0 0 18px;opacity:.65;font-size:13px}
  #card input{width:100%;border:0;border-radius:999px;padding:12px 18px;background:#ffffff12;color:var(--ink);font:inherit;text-align:center;outline:none;margin-bottom:14px}
  #looks{display:flex;justify-content:center;gap:12px;margin-bottom:18px}
  .look{width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font-size:26px;transition:box-shadow .2s}
  .look.on{box-shadow:0 0 0 3px var(--gold),0 0 22px #ffcf6b88}
  #go{width:100%;padding:13px;font-weight:700;font-size:16px}
  #toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:20;padding:9px 18px;border-radius:999px;background:#ffcf6bee;color:#1a0d06;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
  #stick{position:absolute;left:22px;bottom:22px;width:120px;height:120px;border-radius:50%;background:#ffffff14;backdrop-filter:blur(6px);z-index:4;display:none;touch-action:none}
  #knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffcf6bcc;box-shadow:0 0 20px #ff8a3d88;pointer-events:none}
  #jump{position:absolute;right:22px;bottom:70px;width:70px;height:70px;border-radius:50%;border:0;background:#ffffff1c;color:#ffcf6b;font-size:28px;z-index:4;display:none;place-items:center;touch-action:none}
  #loading{position:absolute;inset:0;display:grid;place-items:center;color:#ffcf6b;opacity:.7;z-index:1;pointer-events:none}
</style>
</head><body>
<div id="wrap">
  <div id="stage">
    <div id="loading">lighting the candles…</div>
    <div class="vig"></div><div class="grain"></div>
    <div id="stick"><div id="knob"></div></div>
    <button id="jump">⤒</button>
    <div id="top"><span id="status">…</span><button class="pill" id="invite">💌 Invite link</button></div>
    <div id="actions">
      <button class="pill" id="pov" title="Switch view (V)">👀 3rd person</button>
      <button class="pill" id="heart" title="Send a heart (H)">♥</button>
      <button class="pill" id="share" title="Put a Chrome tab on the screen">🎮 Share a tab</button>
    </div>
  </div>
  <div id="places"></div>
  <div id="hint">WASD move · Space jump · drag to turn · scroll in for 1st person · Shift lock · click a seat to sit · H hearts</div>
</div>
<video id="vid" autoplay playsinline style="display:none"></video>

<div id="start"><div id="card">
  <h1>Our Little Screen</h1>
  <p id="sub">A cozy place to watch things together.</p>
  <input id="name" maxlength="14" placeholder="your name">
  <div id="looks"></div>
  <button class="pill on" id="go">Make our room</button>
</div></div>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const ROOM = params.get('room');
const HOUR_OVERRIDE = params.has('hour') ? parseFloat(params.get('hour')) : null;
const PI = Math.PI;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.opacity = 0, 2400); }

// ---------- renderer ----------
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, .05, 300);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), .75, .55, 1.0);
composer.addPass(bloom); composer.addPass(new OutputPass());
const hemi = new THREE.HemisphereLight('#ffe8d0', '#2a1820', 1); scene.add(hemi);
// soft warm fill that follows the camera so the little ones are never in shadow
const fill = new THREE.PointLight('#ffd8b0', 2.2, 9, 1.6); fill.position.set(0, .3, 0); camera.add(fill); scene.add(camera);
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ---------- building blocks ----------
const memo = {};
const M = (c, o = {}) => memo[c + JSON.stringify(o)] ||= new THREE.MeshStandardMaterial({ color: c, roughness: .85, ...o });
const GLOW = (c, k = 4) => memo['g' + c + k] ||= new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k) });
const SPH = new THREE.SphereGeometry(1, 28, 18);
function put(m, x = 0, y = 0, z = 0, parent) { m.position.set(x, y, z); if (parent) parent.add(m); return m; }
function rbox(w, h, d, c, r = .06, o) { return new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2 - .001, h / 2 - .001, d / 2 - .001)), typeof c === 'string' ? M(c, o) : c); }
function ell(sx, sy, sz, c, o) { const m = new THREE.Mesh(SPH, typeof c === 'string' ? M(c, o) : c); m.scale.set(sx, sy, sz); return m; }
function cyl(rt, rb, h, c, seg = 24, open = false) { return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), typeof c === 'string' ? M(c) : c); }
function plight(c, i, x, y, z, parent, dist = 0) { const l = new THREE.PointLight(c, i, dist, 2); return put(l, x, y, z, parent); }
function mix(a, b, t) { return '#' + new THREE.Color(a).lerp(new THREE.Color(b), t).getHexString(); }
let seed = 7; const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const woodTex = canvasTex(256, 256, (x, w, h) => {
  for (let i = 0; i < 8; i++) { x.fillStyle = ['#8a5a3a', '#7a4e32', '#94603e', '#6e4630'][i % 4]; x.fillRect(0, i * 32, w, 32); x.fillStyle = '#00000030'; x.fillRect(0, i * 32, w, 2); }
  for (let i = 0; i < 40; i++) { x.strokeStyle = '#00000018'; x.beginPath(); const y = rand() * h; x.moveTo(0, y); x.bezierCurveTo(80, y + 6, 160, y - 6, w, y); x.stroke(); }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
function woodMat(c = '#ffffff', rep = 3) { const t = woodTex.clone(); t.needsUpdate = true; t.repeat.set(rep, rep); return new THREE.MeshStandardMaterial({ map: t, color: c, roughness: .8 }); }
const blobTex = canvasTex(64, 64, (x) => { const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, '#000000aa'); g.addColorStop(1, '#00000000'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); });
const blobMat = new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false });

function plant(s = 1, kind = 0) {
  const g = new THREE.Group(), sway = [];
  put(cyl(.22, .16, .36, M('#c8693e', { roughness: .7 })), 0, .18, 0, g);
  put(cyl(.2, .2, .02, '#3a2418'), 0, .35, 0, g);
  const greens = [M('#5fa04a', { roughness: .6 }), M('#3f7a3a', { roughness: .6 }), M('#7cc05a', { roughness: .6 })];
  const n = kind === 1 ? 12 : 9;
  for (let i = 0; i < n; i++) {
    const p = new THREE.Group(); p.position.y = .34; p.rotation.y = i * 2.4; g.add(p);
    const len = kind === 1 ? .38 + (i % 3) * .1 : .26 + (i % 3) * .07;
    const l = ell(kind === 1 ? .05 : .14, .018, len, greens[i % 3]);
    const tilt = kind === 1 ? -1.25 + (i % 3) * .1 : -.55 - (i % 3) * .25;
    l.rotation.x = tilt; l.position.set(0, Math.sin(-tilt) * len * .9 + .05, Math.cos(-tilt) * len * .9);
    p.add(l); sway.push(p);
  }
  g.scale.setScalar(s); g.userData.sway = sway; return g;
}
function hangingPlant(s = 1) {
  const g = new THREE.Group(), sway = [];
  put(cyl(.005, .005, 1, '#00000088'), 0, .5, 0, g);
  put(ell(.18, .14, .18, M('#d07a4a', { roughness: .7 })), 0, 0, 0, g);
  for (let i = 0; i < 10; i++) {
    const p = new THREE.Group(); p.rotation.y = i * 2.4; g.add(p);
    const len = .3 + (i % 4) * .12, l = ell(.1, .015, len, M(i % 2 ? '#5fa04a' : '#3f7a3a', { roughness: .6 }));
    l.rotation.x = .9 + (i % 3) * .2; l.position.set(0, -Math.sin(.9) * len * .9, Math.cos(.9) * len * .9 + .1); p.add(l); sway.push(p);
  }
  g.scale.setScalar(s); g.userData.sway = sway; return g;
}
function swayAll(group, t) { group.traverse(o => { if (o.userData.sway) o.userData.sway.forEach((p, i) => p.rotation.z = Math.sin(t * .9 + i) * .04); }); }

function stringLights(a, b, sag, n, color = '#ffcf6b', parent) {
  const g = new THREE.Group(), A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), pts = [];
  for (let i = 0; i <= 24; i++) { const u = i / 24, p = A.clone().lerp(B, u); p.y -= Math.sin(u * PI) * sag; pts.push(p); }
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, .006, 4), M('#1a1010')));
  const bulbs = [];
  for (let i = 0; i < n; i++) { const u = (i + .5) / n, p = A.clone().lerp(B, u); p.y -= Math.sin(u * PI) * sag + .05; const m = put(new THREE.Mesh(SPH, GLOW(color, 5)), p.x, p.y, p.z, g); m.scale.setScalar(.035); bulbs.push(m); }
  g.userData.bulbs = bulbs; if (parent) parent.add(g); return g;
}
function twinkle(group, t) { group.traverse(o => { if (o.userData.bulbs) o.userData.bulbs.forEach((b, i) => b.scale.setScalar(.03 + .012 * Math.sin(t * 2 + i * 1.7))); }); }

function skyDome(top, mid, bottom) {
  const u = { top: { value: new THREE.Color(top) }, mid: { value: new THREE.Color(mid) }, bottom: { value: new THREE.Color(bottom) } };
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false, uniforms: u,
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
    fragmentShader: 'uniform vec3 top, mid, bottom; varying vec3 vP; void main(){ float h = vP.y; vec3 c = h > 0. ? mix(mid, top, pow(clamp(h*1.6,0.,1.), .55)) : mix(mid, bottom, clamp(-h*5.,0.,1.)); gl_FragColor = vec4(c,1.);\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n}' });
  const s = new THREE.Mesh(new THREE.SphereGeometry(120, 32, 16), m); s.userData.u = u; return s;
}
function starField(n = 600, minY = .08) {
  const p = [];
  for (let i = 0; i < n; i++) { const th = rand() * PI * 2, y = minY + rand() * (1 - minY), r = Math.sqrt(1 - y * y); p.push(Math.cos(th) * r * 110, y * 110, Math.sin(th) * r * 110); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  return new THREE.Points(g, new THREE.PointsMaterial({ color: new THREE.Color('#fff6dd').multiplyScalar(2.2), size: .45, sizeAttenuation: true, fog: false }));
}
function moon(x, y, z, parent, r = 2.2) { put(new THREE.Mesh(SPH, GLOW('#f2efff', 2.2)), x, y, z, parent).scale.setScalar(r); }
function swarm(n, box, color, size = .06) {
  const g = new THREE.BufferGeometry(), base = [];
  for (let i = 0; i < n; i++) base.push(box[0] + rand() * (box[1] - box[0]), box[2] + rand() * (box[3] - box[2]), box[4] + rand() * (box[5] - box[4]));
  g.setAttribute('position', new THREE.Float32BufferAttribute(base.slice(), 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ color: new THREE.Color(color).multiplyScalar(4), size, transparent: true, depthWrite: false }));
  pts.userData.base = base; return pts;
}
function moveSwarm(pts, t, fn) { const a = pts.geometry.attributes.position, b = pts.userData.base; for (let i = 0; i < a.count; i++) { const r = fn(b[i * 3], b[i * 3 + 1], b[i * 3 + 2], i, t); a.setXYZ(i, r[0], r[1], r[2]); } a.needsUpdate = true; }
function fire(parent, x, z, s = 1) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); parent.add(g);
  for (let i = 0; i < 4; i++) { const l = put(cyl(.06, .06, .7, '#4a2a1e'), 0, .06, 0, g); l.rotation.z = PI / 2; l.rotation.y = i * PI / 4; }
  const flames = [['#ff5a1f', .28, .5], ['#ffb347', .19, .38], ['#ffe7a8', .1, .25]].map(([c, r, h], i) => { const f = put(new THREE.Mesh(new THREE.ConeGeometry(r, h, 16), GLOW(c, 3.2 - i * .4)), 0, .12 + h / 2, 0, g); return f; });
  const light = plight('#ff8a3d', 6, 0, .6, 0, g);
  const embers = swarm(26, [-.2, .2, .1, 1.4, -.2, .2], '#ffb347', .035); g.add(embers);
  g.userData.tick = t => {
    const f = .85 + .15 * Math.sin(t * 13) * Math.sin(t * 7.3);
    flames.forEach((m, i) => { m.scale.set(f, f + .1 * Math.sin(t * 9 + i), f); m.rotation.y = t * (i + 1); });
    light.intensity = 5 * s * s * f + 1;
    moveSwarm(embers, t, (x, y, z, i, t) => { const h = (y + t * .6 + i * .07) % 1.4; return [x + Math.sin(t * 2 + i) * .1, h, z]; });
  };
  return g;
}
function beam(parent, from, to, radius, opacity = .045) {
  const A = new THREE.Vector3(...from), B = new THREE.Vector3(...to), d = A.distanceTo(B);
  const m = new THREE.Mesh(new THREE.ConeGeometry(radius, d, 32, 1, true), new THREE.MeshBasicMaterial({ color: '#ffe7a8', transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  m.position.copy(A).add(B).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), A.clone().sub(B).normalize());
  parent.add(m); return m;
}
function couch(parent, x, z, c, w = 2.6, cush = '#ffd88a') {
  const k = new THREE.Group();
  put(rbox(w, .42, .95, c, .14), 0, .21, 0, k); put(rbox(w, .8, .3, c, .14), 0, .62, .36, k);
  for (const s of [-1, 1]) put(rbox(.3, .64, .95, c, .14), s * w / 2, .32, 0, k);
  for (const s of [-1, 1]) put(rbox(w / 2 - .12, .15, .72, mix(c, '#ffffff', .12), .07), s * w / 4, .48, -.06, k);
  const p = put(rbox(.42, .36, .14, cush, .07), -w / 2 + .42, .74, .16, k); p.rotation.z = .2; p.rotation.x = -.2;
  k.position.set(x, 0, z); parent.add(k); return k;
}

// ---------- screen ----------
const placeholderTex = canvasTex(1024, 576, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#fff4e2'); g.addColorStop(1, '#f2d8b8'); x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.fillStyle = '#7a5a4a'; x.textAlign = 'center'; x.font = '600 46px ui-rounded, system-ui'; x.fillText('🎮 pull out the controller', w / 2, h / 2 - 10);
  x.font = '32px ui-rounded, system-ui'; x.globalAlpha = .7; x.fillText('to share a tab: YouTube, Google, anything in Chrome', w / 2, h / 2 + 46);
});
const vid = $('vid');
const videoTex = new THREE.VideoTexture(vid); videoTex.colorSpace = THREE.SRGBColorSpace;
const screenMat = new THREE.MeshBasicMaterial({ map: placeholderTex, toneMapped: false });
let screenLive = false;
function makeScreen(parent, x, y, z, w, h, frame = '#141016') {
  const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g);
  if (frame) put(rbox(w + .16, h + .16, .08, frame, .06), 0, 0, -.06, g);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), screenMat); g.add(mesh);
  const light = plight('#fff1dc', 3, 0, 0, 1.6, g);
  return { g, mesh, w, h, light, center: new THREE.Vector3(x, y, z) };
}
function fitScreen(scr) {
  let sx = 1, sy = 1;
  if (screenLive && vid.videoWidth) { const a = vid.videoWidth / vid.videoHeight, A = scr.w / scr.h; if (a > A) sy = A / a; else sx = a / A; }
  scr.mesh.scale.set(sx, sy, 1);
  scr.light.intensity = screenLive ? 5 : 2.5;
}

// ---------- time of day ----------
const SKY = [[0, '#070a22', '#18163a'], [5, '#15123a', '#3a2a5a'], [6.5, '#5a3a7a', '#ff9a7a'], [8, '#7fb6ef', '#ffd8b0'], [12, '#6fb0f0', '#d4ecff'],
  [17, '#7a9ae0', '#ffd59a'], [19, '#4a2a6a', '#ff7a59'], [20.5, '#1a1640', '#5a2a6a'], [22, '#070a22', '#18163a'], [24, '#070a22', '#18163a']];
function hourNow() { if (HOUR_OVERRIDE !== null) return HOUR_OVERRIDE; const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
function skyAt(h) { for (let i = 0; i < SKY.length - 1; i++) { const [h0, a0, b0] = SKY[i], [h1, a1, b1] = SKY[i + 1]; if (h >= h0 && h <= h1) { const u = (h - h0) / (h1 - h0); return [mix(a0, a1, u), mix(b0, b1, u)]; } } return [SKY[0][1], SKY[0][2]]; }
function daylight(h) { return Math.max(0, Math.min(1, Math.sin((h - 6) / 13.5 * PI) * 1.6)); }

// ---------- places ----------
// Each place: screen in front (toward -z), viewers face -z. seats: {x,z,y,ry}. bounds: [x0,x1,z0,z1]. cam: camera box.
function room(g, w, d, wallMat, floorMat, h = 3.4) {

    if (!faceCam) me.ry = angLerp(me.ry, Math.atan2(vx, vz), Math.min(1, dt * 14));
  } else if (me.seat < 0) {
    const dx = me.tx - me.x, dz = me.tz - me.z, d = Math.hypot(dx, dz);
    me.walking = d > .03;
    if (me.walking) { const m = Math.min(d, sp * dt); me.x += dx / d * m; me.z += dz / d * m; if (!faceCam) me.ry = angLerp(me.ry, Math.atan2(dx, dz), Math.min(1, dt * 12)); }
    else if (me.want >= 0) { if (them && them.seat === me.want) me.want = -1; else { me.seat = me.want; me.want = -1; } }
  }
  if (me.seat >= 0) { const s = place.seats[me.seat]; me.walking = false; me.x = s.x; me.z = s.z; me.ry = angLerp(me.ry, s.ry, Math.min(1, dt * 10)); }
  else {
    if (faceCam) me.ry = angLerp(me.ry, cam.yaw + PI, Math.min(1, dt * 20));
    if (me.want < 0) { me.x = Math.max(b[0], Math.min(b[1], me.x)); me.z = Math.max(b[2], Math.min(b[3], me.z)); }
  }
  if (me.jy > 0) { me.vy -= 13 * dt; me.jy += me.vy * dt; if (me.jy <= 0) { me.jy = 0; me.vy = 0; } }
  if (them) { const k = Math.min(1, dt * 10); them.x += (them.rx - them.x) * k; them.z += (them.rz - them.z) * k; them.ry = angLerp(them.ry, them.rry, k); them.jy += ((them.rjy || 0) - (them.jy || 0)) * Math.min(1, dt * 20); }
}
function placeChar(mesh, p) { const y = (p.seat >= 0 && place.seats[p.seat] ? place.seats[p.seat].y - .05 : 0) + (p.jy || 0); mesh.position.set(p.x, y, p.z); mesh.rotation.y = p.ry; }

// ---------- hearts ----------
const heartTex = c => canvasTex(64, 64, (x) => { x.fillStyle = c; x.font = '52px system-ui'; x.textAlign = 'center'; x.fillText('♥', 32, 50); });
const heartTexs = { mine: heartTex('#ff7a59'), theirs: heartTex('#ffb3c6') };
const hearts = [];
function addHeart(p, which) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: heartTexs[which], transparent: true, depthWrite: false }));
  s.position.copy(headOf(p)).add(new THREE.Vector3(0, .5, 0)); s.scale.setScalar(.3); scene.add(s); hearts.push({ s, t0: clock.elapsedTime, p: Math.random() * 6 });
}
function sendHeart() { addHeart(me, 'mine'); send({ t: 'heart' }); }
$('heart').onclick = sendHeart;
const cuddle = new THREE.Sprite(new THREE.SpriteMaterial({ map: heartTexs.mine, transparent: true, depthWrite: false })); cuddle.scale.setScalar(.35); scene.add(cuddle);

// ---------- loop ----------
const clock = new THREE.Clock(); let lastSent = 0;
function loop() {
  const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
  step(dt);
  placeChar(meMesh, me); animChar(meMesh, me, t);
  if (them) { if (!themMesh || themMesh.userData.look !== them.look || themMesh.userData.name !== them.name) { if (themMesh) scene.remove(themMesh); themMesh = makeChar(them.look, them.name); scene.add(themMesh); } placeChar(themMesh, them); animChar(themMesh, them, t); }
  else if (themMesh) { scene.remove(themMesh); themMesh = null; }
  place.tick(t, dt); fitScreen(place.scr);
  const close = them && me.seat >= 0 && them.seat >= 0 && Math.abs(me.seat - them.seat) === 1;
  cuddle.visible = !!close; if (close) { cuddle.position.copy(headOf(me)).lerp(headOf(them), .5).add(new THREE.Vector3(0, .45 + Math.sin(t * 2) * .05, 0)); }
  for (let i = hearts.length - 1; i >= 0; i--) { const h = hearts[i], a = (t - h.t0) / 2.2; if (a > 1) { scene.remove(h.s); hearts.splice(i, 1); continue; } h.s.position.y += dt * .5; h.s.position.x += Math.sin(a * 9 + h.p) * .004; h.s.material.opacity = 1 - a; }
  stepCam(dt);
  composer.render();
  if (t - lastSent > .066) { lastSent = t; send({ t: 'me', x: +me.x.toFixed(3), z: +me.z.toFixed(3), ry: +me.ry.toFixed(3), seat: me.seat, w: me.walking, j: +me.jy.toFixed(3) }); }
  requestAnimationFrame(loop);
}

// ---------- networking (PeerJS: a direct connection between the two of you) ----------
let peer, conn, call, myStream, myRoom = '';
function send(m) { if (conn && conn.open) conn.send(m); }
function setStatus(s) { $('status').textContent = s; }
function onData(m) {
  if (m.t === 'hello') {
    const sp = isHost ? place.spawn[1] : place.spawn[0];
    them = them || { x: sp[0], z: sp[1], rx: sp[0], rz: sp[1], ry: PI, rry: PI, jy: 0, seat: -1, share: false };
    Object.assign(them, { name: m.name, look: m.look });
    setStatus(`💞 together with ${m.name}`);
    if (m.reply) return;
    send({ t: 'hello', name: me.name, look: me.look, reply: true });
    if (isHost) send({ t: 'place', id: place.id });
    if (myStream) { startCall(); send({ t: 'share', on: true }); }
  } else if (m.t === 'me' && them) { them.rx = m.x; them.rz = m.z; them.rry = m.ry; them.seat = m.seat; them.walking = m.w; them.rjy = m.j || 0; }
  else if (m.t === 'place') { if (m.id !== place.id) { setPlace(m.id, false); toast(`${them ? them.name : 'They'} took you to ${place.name}`); } }
  else if (m.t === 'heart' && them) addHeart(them, 'theirs');
  else if (m.t === 'share' && them) {
    them.share = m.on;
    if (m.on && myStream) stopShare(false); // one controller at a time
    if (!m.on && !myStream) showStream(null);
  }
}
function wire(c) {
  conn = c;
  c.on('open', () => send({ t: 'hello', name: me.name, look: me.look }));
  c.on('data', onData);
  c.on('close', () => { them = null; conn = null; setStatus(isHost ? '💌 waiting… send the invite link' : '💔 disconnected, refresh to rejoin'); if (!myStream) showStream(null); });
}
function connect() {
  const id = isHost ? 'ols-' + Math.random().toString(36).slice(2, 8) : undefined;
  peer = new Peer(id, { debug: 1 });
  peer.on('open', pid => {
    if (isHost) { myRoom = pid; history.replaceState(null, '', '?room=' + pid + (HOUR_OVERRIDE !== null ? '&hour=' + HOUR_OVERRIDE : '')); setStatus('💌 waiting… send the invite link'); }
    else { myRoom = ROOM; setStatus('connecting…'); wire(peer.connect(ROOM, { reliable: true })); }
  });
  peer.on('connection', c => { if (conn && conn.open) { c.close(); return; } wire(c); });
  peer.on('call', c => { call = c; c.answer(); c.on('stream', s => { if (!myStream) showStream(s); }); });
  peer.on('error', e => setStatus(e.type === 'peer-unavailable' ? '🫥 room not found, ask for a new link' : '⚠️ ' + e.type));
  peer.on('disconnected', () => peer.reconnect());
}
$('invite').onclick = async () => {
  const link = location.origin + location.pathname + '?room=' + myRoom;
  if (navigator.share && /Mobi|iPhone|Android/i.test(navigator.userAgent)) { try { await navigator.share({ title: 'Our Little Screen', text: 'come watch with me ♥', url: link }); return; } catch {} }
  try { await navigator.clipboard.writeText(link); toast('Link copied ♥ send it over'); } catch { prompt('Send this link:', link); }
};

// ---------- the shared screen ----------
function showStream(s, mine = false) {
  vid.srcObject = s || null; vid.muted = !!mine; screenLive = !!s;
  screenMat.map = s ? videoTex : placeholderTex; screenMat.needsUpdate = true;
  if (s) vid.play().catch(() => toast('Click anywhere to turn the sound on'));
}
addEventListener('pointerdown', () => { if (screenLive && vid.paused) vid.play(); });
function startCall() { if (conn && myStream) { if (call) call.close(); call = peer.call(conn.peer, myStream); } }
async function share() {
  if (myStream) return stopShare();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) { toast('Sharing needs Chrome on a computer. You can still watch here ♥'); return; }
  try { myStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true, selfBrowserSurface: 'exclude', surfaceSwitching: 'include', preferCurrentTab: false }); }
  catch { return; }
  myStream.getVideoTracks()[0].onended = () => stopShare();
  me.share = true; $('share').classList.add('on'); $('share').textContent = '🎮 Stop sharing';
  showStream(myStream, true); startCall(); send({ t: 'share', on: true });
  toast('Tip: pick a Chrome tab and turn on "share tab audio"');
}
function stopShare(tell = true) {
  if (myStream) myStream.getTracks().forEach(tr => tr.stop());
  myStream = null; if (call) { call.close(); call = null; }
  me.share = false; $('share').classList.remove('on'); $('share').textContent = '🎮 Share a tab';
  showStream(null); if (tell) send({ t: 'share', on: false });
}
$('share').onclick = share;

// ---------- start ----------
if (ROOM) { $('sub').textContent = 'You were invited ♥ pick your little you.'; $('go').textContent = 'Join'; }
$('go').onclick = () => {
  me.name = ($('name').value.trim() || (ROOM ? 'you' : 'me')).slice(0, 14); me.look = myLook;
  try { localStorage.setItem('ols-name', me.name); localStorage.setItem('ols-look', myLook); } catch {}
  $('start').remove(); $('loading').remove(); resize();
  meMesh = makeChar(me.look, me.name); scene.add(meMesh);
  setPlace(PLACES[0].id, false); connect(); loop();
};
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
window.dbg = { me, get them() { return them }, setPlace, togglePov, turn, jump, keys, get pov() { return pov }, share, cam, get place() { return place } };
</script>
</body></html>
